spring.application.name=footbook
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/footbook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Murad1310}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-should-be-at-least-32-characters-long-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.servlet.context-path=/
server.port=8080