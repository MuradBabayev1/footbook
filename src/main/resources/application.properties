spring.application.name=footbook
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/footbook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Murad1310}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-should-be-at-least-32-characters-long-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.servlet.context-path=/
server.port=8080

# Bootstrap admin account (change these in production)
footbook.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
footbook.bootstrap.admin.full-name=${ADMIN_FULL_NAME:Footbook Admin}
footbook.bootstrap.admin.email=${ADMIN_EMAIL:admin@footbook.com}
footbook.bootstrap.admin.phone=${ADMIN_PHONE:+10000000000}
footbook.bootstrap.admin.password=${ADMIN_PASSWORD:Admin@123456}