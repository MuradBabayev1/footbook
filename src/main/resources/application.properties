spring.application.name=footbook
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/footbook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Murad1310}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-key-min-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cache Configuration (Redis)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true

# Server Configuration
server.servlet.context-path=/
server.port=${SERVER_PORT:8080}

# Frontend dev server auto-start (used when running Spring Boot directly in dev)
footbook.frontend.auto-start=${FRONTEND_AUTO_START:true}
footbook.frontend.port=${FRONTEND_PORT:3000}

# Bootstrap admin account (change these in production)
footbook.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
footbook.bootstrap.admin.full-name=${ADMIN_FULL_NAME:Footbook Admin}
footbook.bootstrap.admin.email=${ADMIN_EMAIL:admin@footbook.com}
footbook.bootstrap.admin.phone=${ADMIN_PHONE:+10000000000}
footbook.bootstrap.admin.password=${ADMIN_PASSWORD:admin123456}
footbook.bootstrap.admin.reset-password=${ADMIN_RESET_PASSWORD:true}

# Email verification
footbook.verification.code-exp-minutes=${VERIFICATION_CODE_EXP_MINUTES:15}

# Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

footbook.mail.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}
footbook.mail.from-name=${MAIL_FROM_NAME:Footbook}
footbook.mail.verification-subject=${MAIL_VERIFICATION_SUBJECT:Footbook verification code}
