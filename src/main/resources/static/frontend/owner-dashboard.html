<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footbook | Owner Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/owner-dashboard.css">
    <link rel="stylesheet" href="styles/football-theme.css">
    <style>
        body {
            visibility: hidden;
        }

        body.auth-ready {
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="owner-layout">
        <header class="owner-topbar">
            <div>
                <p class="kicker">Footbook Owner Hub</p>
                <h1>Owner Stadium Panel</h1>
                <p class="sub" id="ownerInfo">Signed in as Owner</p>
            </div>
            <a href="index.html" id="logoutLink" class="btn secondary">Logout</a>
        </header>

        <section class="stats">
            <article class="card">
                <h2>Total My Stadiums</h2>
                <strong id="totalStadiums">0</strong>
            </article>
            <article class="card">
                <h2>Available</h2>
                <strong id="availableStadiums">0</strong>
            </article>
            <article class="card">
                <h2>Unavailable</h2>
                <strong id="unavailableStadiums">0</strong>
            </article>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2 id="formTitle">Add New Stadium</h2>
                <button type="button" class="btn secondary" id="resetFormBtn">Reset</button>
            </div>
            <form id="stadiumForm" novalidate>
                <input type="hidden" id="stadiumId">
                <div class="grid">
                    <div class="field">
                        <label for="name">Stadium Name</label>
                        <input id="name" name="name" type="text" required>
                    </div>
                    <div class="field">
                        <label for="city">City</label>
                        <input id="city" name="city" type="text" required>
                    </div>
                    <div class="field full">
                        <label for="location">Location</label>
                        <input id="location" name="location" type="text" required>
                    </div>
                    <div class="field">
                        <label for="capacity">Capacity</label>
                        <input id="capacity" name="capacity" type="number" min="1" required>
                    </div>
                    <div class="field">
                        <label for="available">Availability</label>
                        <select id="available" name="available">
                            <option value="true">Available</option>
                            <option value="false">Unavailable</option>
                        </select>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn" id="saveBtn">Create Stadium</button>
                </div>
                <div class="status" id="formStatus" aria-live="polite"></div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2>My Stadiums</h2>
                <button type="button" class="btn secondary" id="refreshBtn">Refresh</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>City</th>
                            <th>Location</th>
                            <th>Capacity</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stadiumTableBody">
                        <tr>
                            <td colspan="6" class="empty">Loading stadiums...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="js/owner-dashboard.js?v=20260411-1"></script>
</body>
</html>
